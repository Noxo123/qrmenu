<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19a463"><title>Avis — QRMenu</title><link rel="stylesheet" href="/assets/style.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#f5faf7,#fff)}.feedback-box{width:min(520px,100%);text-align:center}.rating{display:flex;justify-content:center;gap:8px;margin:22px 0}.rating button{border:0;background:#f0f4f1;border-radius:14px;width:52px;height:52px;font-size:24px;cursor:pointer;transition:.18s}.rating button.active{background:#19a463;color:#fff;transform:translateY(-2px)}textarea{width:100%;min-height:120px;resize:vertical;border:1px solid #dfe6e1;border-radius:14px;padding:14px;font:inherit;box-sizing:border-box;outline:none}.success{display:none;padding:20px;border-radius:16px;background:#eaf8f0;color:#147b4b}</style></head><body><main class="card feedback-box"><div class="eyebrow">QRMenu · VOTRE AVIS</div><h1 id="title">Votre avis compte</h1><p id="sub" class="muted">Comment s’est passée votre expérience ?</p><div id="form"><div class="rating" aria-label="Note"><button data-rating="1">★</button><button data-rating="2">★</button><button data-rating="3">★</button><button data-rating="4">★</button><button data-rating="5">★</button></div><textarea id="comment" maxlength="1000" placeholder="Un commentaire ? (facultatif)"></textarea><button id="send" class="btn green" style="width:100%;margin-top:14px">Envoyer mon avis</button></div><div id="success" class="success">Merci pour votre avis ! ❤️</div></main><script>const slug=decodeURIComponent(location.pathname.split('/').pop());let rating=0;document.querySelectorAll('[data-rating]').forEach(b=>b.onclick=()=>{rating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('active',Number(x.dataset.rating)<=rating))});document.querySelector('#send').onclick=async()=>{if(!rating)return alert('Choisissez une note.');const b=document.querySelector('#send');b.disabled=true;try{const r=await fetch('/api/public/feedback/'+encodeURIComponent(slug),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rating,comment:document.querySelector('#comment').value})});if(!r.ok)throw new Error();document.querySelector('#form').style.display='none';document.querySelector('#success').style.display='block'}catch(e){alert('Impossible d’envoyer votre avis.')}finally{b.disabled=false}};</script></body></html>
