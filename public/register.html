<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Créer un compte — QRMenu</title><link rel="stylesheet" href="/assets/style.css"></head><body><div class="container" style="max-width:500px"><div class="center" style="margin:35px 0"><a class="brand" href="/">QR<span>Menu</span></a></div><div class="card"><h1>Créer votre menu</h1><p class="muted">Votre espace sera prêt en quelques secondes.</p><form id="form"><label class="label">Votre nom</label><input class="input" name="name" required><label class="label">Email</label><input class="input" name="email" type="email" required><label class="label">Nom du restaurant</label><input class="input" name="restaurant" required><label class="label">Mot de passe</label><input class="input" name="password" type="password" minlength="8" required><p id="error" style="color:#dc2626"></p><button class="btn green" style="width:100%">Créer mon espace</button></form><p class="muted center">Déjà inscrit ? <a href="/login">Se connecter</a></p></div></div><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)return error.textContent=d.error;location.href=d.redirect}</script></body></html>
