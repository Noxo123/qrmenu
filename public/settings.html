<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paramètres — QRMenu</title><link rel="stylesheet" href="/assets/style.css"></head><body><nav class="nav"><a class="brand" href="/dashboard">QR<span>Menu</span></a><a class="btn light" href="/dashboard">Dashboard</a></nav><main class="container" style="max-width:700px"><div class="card"><h1>⚙️ Paramètres du restaurant</h1><label class="label">Nom</label><input class="input" id="name"><label class="label">Description</label><textarea class="input" id="description" rows="4"></textarea><label class="label">Téléphone</label><input class="input" id="phone"><label class="label">Adresse</label><input class="input" id="address"><label class="label">URL du logo</label><input class="input" id="logo_url"><label class="label">Thème</label><select class="input" id="theme"><option value="light">Clair</option><option value="dark">Sombre</option></select><p><button class="btn green" onclick="saveSettings()">Enregistrer</button></p></div></main><script src="/assets/app.js"></script><script>loadMe().then(x=>{for(const k of ['name','description','phone','address','logo_url','theme'])document.querySelector('#'+k).value=x.restaurant[k]||''}).catch(()=>location='/login')</script></body></html>
