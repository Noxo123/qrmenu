<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connexion — QRMenu</title><link rel="stylesheet" href="/assets/style.css"></head><body><div class="container" style="max-width:460px"><div class="center" style="margin:50px 0"><a class="brand" href="/">QR<span>Menu</span></a></div><div class="card"><h1>Connexion</h1><form id="form"><label class="label">Email</label><input class="input" name="email" type="email" required><label class="label">Mot de passe</label><input class="input" name="password" type="password" required><p id="error" style="color:#dc2626"></p><button class="btn green" style="width:100%">Se connecter</button></form><p class="muted center">Pas encore de compte ? <a href="/register">Créer un compte</a></p></div></div><script>form.onsubmit=async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const d=await r.json();if(!r.ok)return error.textContent=d.error;location.href=d.redirect}</script></body></html>
