<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19a463"><title>Menu — QRMenu</title><link rel="stylesheet" href="/assets/style.css"><style>
:root{--primary:#19a463;--ink:#17201b;--muted:#718078;--line:#e8ece9;--surface:#fff;--soft:#f5f8f6}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#f7faf8 0,#fff 380px);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.menu-page{width:min(920px,100%);margin:auto;padding:0 18px 42px}.public-top{position:relative;text-align:center;padding:48px 10px 28px}.public-top:after{content:"";position:absolute;left:15%;right:15%;bottom:0;height:1px;background:var(--line)}.public-top img{width:88px;height:88px;max-width:88px;max-height:88px;border-radius:24px;object-fit:cover;margin-bottom:17px;box-shadow:0 12px 30px #00000012}.eyebrow{display:inline-flex;padding:6px 10px;border-radius:999px;background:#e9f7f0;color:var(--primary);font-size:10px;font-weight:800;letter-spacing:.12em}.public-top h1{font-size:clamp(30px,6vw,48px);letter-spacing:-.04em;margin:12px 0 7px}.public-top p{max-width:620px;margin:0 auto;line-height:1.6}.public-actions{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:20px 0 4px}.order-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border-radius:12px}.menu-search-wrap{position:sticky;top:10px;z-index:5;padding:20px 0 10px}.menu-search{display:block;width:min(620px,100%);margin:auto;padding:14px 17px;border:1px solid #dfe6e1;border-radius:15px;background:#ffffffeb;backdrop-filter:blur(14px);font:inherit;outline:none;box-shadow:0 8px 25px #10271a0b;transition:.2s}.menu-search:focus{border-color:var(--primary);box-shadow:0 0 0 4px #19a46318}.category-nav{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:7px 2px 15px;position:sticky;top:70px;background:#ffffffd9;backdrop-filter:blur(14px);z-index:4}.category-nav::-webkit-scrollbar{display:none}.category-nav button{white-space:nowrap;border:1px solid #e1e7e3;background:#fff;color:#526159;border-radius:999px;padding:9px 14px;cursor:pointer;font-weight:700;transition:transform .18s,background .18s,color .18s,border-color .18s}.category-nav button:hover{transform:translateY(-1px)}.category-nav button.active{background:var(--primary);color:#fff;border-color:var(--primary);box-shadow:0 5px 15px #19a4632b}.menu-category-public{scroll-margin-top:135px;margin:28px 0}.menu-category-public h2{font-size:21px;letter-spacing:-.02em;margin:0 0 9px}.menu-item{display:flex;align-items:center;gap:14px;padding:15px 8px;border-bottom:1px solid var(--line);border-radius:14px;cursor:pointer;transition:background .18s,transform .18s}.menu-item:hover{background:var(--soft);transform:translateX(2px)}.menu-item:active{transform:scale(.995)}.menu-item img{width:82px;height:82px;object-fit:cover;border-radius:16px;flex:none;background:#eef2ef}.menu-item-main{min-width:0;flex:1}.menu-item-main strong{display:block;font-size:16px}.menu-item-main p{margin:5px 0 0;font-size:13px;line-height:1.5;color:var(--muted)}.price{font-weight:850;white-space:nowrap;align-self:flex-start;padding-top:2px}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.badge{font-size:10px;font-weight:700;padding:4px 7px;border-radius:999px;background:#f0f4f1;color:#55645c}.empty,.no-results{text-align:center;color:var(--muted);padding:25px 15px}.public-footer{margin-top:45px;text-align:center;color:#98a39d;font-size:12px}.detail-modal{position:fixed;inset:0;background:#07120cb8;backdrop-filter:blur(7px);display:none;align-items:flex-end;justify-content:center;z-index:20;padding:0}.detail-modal.open{display:flex;animation:fade .18s ease}.detail-box{background:#fff;color:var(--ink);width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:14px 20px 28px;box-shadow:0 -15px 60px #0003;animation:sheet .22s ease}.detail-box:before{content:"";display:block;width:42px;height:4px;background:#dce2de;border-radius:4px;margin:0 auto 13px}.detail-box img{display:block;width:100%;max-height:330px;object-fit:cover;border-radius:18px;margin-bottom:18px}.detail-box h2{font-size:27px;letter-spacing:-.03em;margin:0 50px 7px 0}.detail-box p{color:var(--muted);line-height:1.65}.close-detail{position:absolute;margin-left:-48px;margin-top:3px;border:0;background:#eef2ef;color:#25332b;border-radius:50%;width:38px;height:38px;cursor:pointer;font-size:20px}.detail-price{font-size:20px;font-weight:850;margin-top:20px}.theme-dark{background:linear-gradient(180deg,#0e1511,#111827);color:#f7faf8}.theme-dark .category-nav{background:#111827dc}.theme-dark .category-nav button{background:#1b2520;color:#eef4ef;border-color:#303b35}.theme-dark .menu-search{background:#18211cdd;color:#fff;border-color:#344038}.theme-dark .menu-item:hover{background:#18211c}.theme-dark .menu-item{border-color:#303934}.theme-dark .menu-item-main p,.theme-dark .muted{color:#aeb9b2}.theme-dark .detail-box{background:#1b2520;color:#f7faf8}.theme-dark .close-detail{background:#29352e;color:#fff}.theme-dark .badge{background:#29352e;color:#dce6df}.theme-dark .eyebrow{background:#193426}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes sheet{from{transform:translateY(25px);opacity:.7}to{transform:translateY(0);opacity:1}}@media(max-width:600px){.menu-page{padding:0 14px 30px}.public-top{padding:34px 8px 24px}.menu-item{padding:13px 5px}.menu-item img{width:68px;height:68px;border-radius:13px}.menu-item-main p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{font-size:14px}.category-nav{top:64px}.menu-category-public{scroll-margin-top:125px}.detail-box{padding-left:16px;padding-right:16px}}
</style></head><body><main class="menu-page"><header class="public-top menu-header"><img id="logo" style="display:none" alt="Logo"><div class="eyebrow">MENU DU RESTAURANT</div><h1 id="restaurant">Chargement…</h1><p id="description" class="muted"></p><p id="address" class="muted" style="margin-top:3px"></p><div class="public-actions"><a id="orderBtn" class="btn green order-btn" style="display:none" target="_blank">Commander ↗</a><a id="instagramBtn" class="btn light order-btn" style="display:none" target="_blank">Instagram</a></div></header><div class="menu-search-wrap"><input id="search" class="menu-search" type="search" autocomplete="off" placeholder="🔎  Rechercher un plat, une boisson…"></div><nav id="categoryNav" class="category-nav"></nav><div id="menu"></div><footer class="public-footer">Menu numérique · QRMenu</footer></main><div id="detailModal" class="detail-modal"><div class="detail-box"><button class="close-detail" id="closeDetail" aria-label="Fermer">×</button><div id="detail"></div></div></div><script>
const slug=location.pathname.split('/').pop(),restaurant=document.querySelector('#restaurant'),description=document.querySelector('#description'),address=document.querySelector('#address'),logo=document.querySelector('#logo'),menu=document.querySelector('#menu'),nav=document.querySelector('#categoryNav'),search=document.querySelector('#search'),modal=document.querySelector('#detailModal');let DATA=null;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(q=''){if(!DATA)return;const v=q.trim().toLowerCase();nav.innerHTML=DATA.categories.map((c,i)=>`<button class="${i===0?'active':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');let count=0;menu.innerHTML=DATA.categories.map(c=>{const ps=c.products.filter(p=>!v||(p.name+' '+(p.description||'')+' '+(p.tags||'')).toLowerCase().includes(v));count+=ps.length;return `<section id="cat-${c.id}" class="menu-category-public"><h2>${esc(c.name)}</h2>${ps.length?ps.map(p=>`<article class="menu-item" data-product="${p.id}" tabindex="0" role="button"><img ${p.image_url?`src="${esc(p.image_url)}"`:''} style="${p.image_url?'':'display:none'}" alt=""><div class="menu-item-main"><strong>${esc(p.name)}</strong><p>${esc(p.description||'')}</p><div class="badges">${p.featured?'<span class="badge">⭐ Vedette</span>':''}${p.tags?`<span class="badge">${esc(p.tags)}</span>`:''}${p.allergens?`<span class="badge">Allergènes: ${esc(p.allergens)}</span>`:''}</div></div><div class="price">${Number(p.price).toFixed(2)} €</div></article>`).join(''):'<div class="empty">Aucun produit disponible.</div>'}</section>`}).join('');if(!count)menu.innerHTML='<div class="no-results">Aucun résultat.<br><small>Essayez un autre nom ou une autre catégorie.</small></div>'}
function openProduct(id){const p=DATA.categories.flatMap(c=>c.products).find(x=>x.id==id);if(!p)return;document.querySelector('#detail').innerHTML=`${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:''}<h2>${esc(p.name)}</h2><p>${esc(p.description||'Aucune description disponible.')}</p><div class="badges">${p.featured?'<span class="badge">⭐ Produit vedette</span>':''}${p.tags?`<span class="badge">${esc(p.tags)}</span>`:''}${p.allergens?`<span class="badge">Allergènes: ${esc(p.allergens)}</span>`:''}</div><div class="detail-price">${Number(p.price).toFixed(2)} €</div>`;modal.classList.add('open');document.body.style.overflow='hidden'}function closeProduct(){modal.classList.remove('open');document.body.style.overflow=''}
document.querySelector('#closeDetail').onclick=closeProduct;modal.onclick=e=>{if(e.target===modal)closeProduct()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeProduct()});menu.addEventListener('click',e=>{const item=e.target.closest('[data-product]');if(item)openProduct(item.dataset.product)});menu.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.closest('[data-product]')){e.preventDefault();openProduct(e.target.closest('[data-product]').dataset.product)}});nav.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelector('#cat-'+b.dataset.cat)?.scrollIntoView({behavior:'smooth',block:'start'});nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});search.oninput=()=>render(search.value);
fetch('/api/public/menu/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{DATA=d;document.title=d.restaurant.name+' — Menu';restaurant.textContent=d.restaurant.name;description.textContent=d.restaurant.description||'';address.textContent=d.restaurant.address||'';if(d.restaurant.logo_url){logo.src=d.restaurant.logo_url;logo.style.display='inline-block'}if(d.restaurant.order_url){const b=document.querySelector('#orderBtn');b.href=d.restaurant.order_url;b.style.display='inline-flex'}if(d.restaurant.instagram){const b=document.querySelector('#instagramBtn');b.href=d.restaurant.instagram;b.style.display='inline-flex'}if(d.restaurant.theme==='dark')document.body.classList.add('theme-dark');if(d.restaurant.accent_color){document.documentElement.style.setProperty('--primary',d.restaurant.accent_color);document.querySelector('meta[name="theme-color"]').content=d.restaurant.accent_color}render()}).catch(()=>{restaurant.textContent='Menu indisponible';description.textContent='Ce restaurant n’est pas accessible pour le moment.'});
</script></body></html>
