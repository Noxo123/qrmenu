<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19a463"><title>Menu — QRMenu</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="menu-page"><header class="public-top menu-header"><img id="logo" style="display:none" alt="Logo"><div class="eyebrow">MENU DU RESTAURANT</div><h1 id="restaurant">Chargement…</h1><p id="description" class="muted"></p><p id="address" class="muted" style="margin-bottom:0"></p></header><div id="menu"></div><footer class="public-footer">Menu numérique · QRMenu</footer></main><script>const slug=location.pathname.split('/').pop(),restaurant=document.querySelector('#restaurant'),description=document.querySelector('#description'),address=document.querySelector('#address'),logo=document.querySelector('#logo'),menu=document.querySelector('#menu');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));fetch('/api/public/menu/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{document.title=d.restaurant.name+' — Menu';restaurant.textContent=d.restaurant.name;description.textContent=d.restaurant.description||'';address.textContent=d.restaurant.address||'';if(d.restaurant.logo_url){logo.src=d.restaurant.logo_url;logo.style.display='inline-block'}menu.innerHTML=d.categories.length?d.categories.map(c=>`<section class="menu-category-public"><h2>${esc(c.name)}</h2>${c.products.length?c.products.map(p=>`<article class="menu-item">${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}<div class="menu-item-main"><strong>${esc(p.name)}</strong><p class="muted" style="margin:5px 0 0;font-size:13px;line-height:1.5">${esc(p.description||'')}</p></div><div class="price">${Number(p.price).toFixed(2)} €</div></article>`).join(''):'<div class="empty">Aucun produit disponible.</div>'}</section>`).join(''):'<div class="empty" style="margin-top:25px">Le menu est en cours de préparation.</div>'}).catch(()=>{restaurant.textContent='Menu indisponible';description.textContent='Ce restaurant n’est pas accessible pour le moment.'})</script></body></html>
