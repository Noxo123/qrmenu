<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Menu — QRMenu</title><link rel="stylesheet" href="/assets/style.css"></head><body><main class="menu-page"><header class="menu-header"><img id="logo" style="display:none"><h1 id="restaurant">Chargement…</h1><p id="description" class="muted"></p><p id="address" class="muted"></p></header><div id="menu"></div><footer class="center muted" style="margin:40px 0">Menu numérique par QRMenu</footer></main><script>const slug=location.pathname.split('/').pop();fetch('/api/public/menu/'+slug).then(r=>r.json()).then(d=>{restaurant.textContent=d.restaurant.name;description.textContent=d.restaurant.description||'';address.textContent=d.restaurant.address||'';if(d.restaurant.logo_url){logo.src=d.restaurant.logo_url;logo.style.display='inline-block'}menu.innerHTML=d.categories.map(c=>`<section class="menu-category"><h2>${c.name}</h2>${c.products.map(p=>`<article class="menu-item">${p.image_url?`<img src="${p.image_url}">`:''}<div class="menu-item-main"><strong>${p.name}</strong><p class="muted">${p.description||''}</p></div><div class="price">${Number(p.price).toFixed(2)} €</div></article>`).join('')}</section>`).join('')}).catch(()=>{restaurant.textContent='Menu indisponible'})</script></body></html>
