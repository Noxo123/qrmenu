<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#19a463"><title>Menu — QRMenu</title><link rel="stylesheet" href="/assets/style.css"><style>
.menu-page{max-width:980px;margin:auto;padding:20px}.public-top{text-align:center;padding:30px 10px}.public-top img{max-width:110px;max-height:110px;border-radius:20px;object-fit:cover;margin-bottom:15px}.public-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.menu-search{width:100%;max-width:560px;margin:0 auto 20px;display:block;box-sizing:border-box;padding:13px 16px;border:1px solid #d9dee7;border-radius:14px;font:inherit}.category-nav{display:flex;gap:8px;overflow:auto;padding:4px 0 14px;position:sticky;top:0;background:#fff;z-index:3}.category-nav button{white-space:nowrap;border:1px solid #e1e6ed;background:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}.category-nav button.active{background:#19a463;color:#fff;border-color:#19a463}.menu-category-public{margin:24px 0}.menu-category-public h2{margin-bottom:10px}.menu-item{display:flex;align-items:center;gap:13px;padding:15px 0;border-bottom:1px solid #edf0f3;cursor:pointer}.menu-item img{width:72px;height:72px;object-fit:cover;border-radius:13px;flex:none}.menu-item-main{min-width:0;flex:1}.menu-item-main strong{display:block}.price{font-weight:800;white-space:nowrap}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badge{font-size:11px;padding:3px 7px;border-radius:999px;background:#f1f5f3}.detail-modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}.detail-modal.open{display:flex}.detail-box{background:#fff;width:min(600px,100%);max-height:88vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px}.detail-box img{width:100%;max-height:300px;object-fit:cover;border-radius:16px}.close-detail{float:right;border:0;background:#eef1f4;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:20px}.order-btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}.no-results{text-align:center;padding:35px}.public-footer{text-align:center;padding:35px 0}.theme-dark{background:#111827;color:#f9fafb}.theme-dark .category-nav{background:#111827}.theme-dark .category-nav button{background:#1f2937;color:#fff;border-color:#374151}.theme-dark .menu-item{border-color:#374151}.theme-dark .muted{color:#9ca3af}.theme-dark .detail-box{background:#1f2937}
</style></head><body><main class="menu-page"><header class="public-top menu-header"><img id="logo" style="display:none" alt="Logo"><div class="eyebrow">MENU DU RESTAURANT</div><h1 id="restaurant">Chargement…</h1><p id="description" class="muted"></p><p id="address" class="muted" style="margin-bottom:0"></p><div class="public-actions"><a id="orderBtn" class="btn green order-btn" style="display:none" target="_blank">Commander ↗</a><a id="instagramBtn" class="btn light order-btn" style="display:none" target="_blank">Instagram</a></div></header><input id="search" class="menu-search" type="search" placeholder="🔎 Rechercher dans le menu…"><nav id="categoryNav" class="category-nav"></nav><div id="menu"></div><footer class="public-footer">Menu numérique · QRMenu</footer></main><div id="detailModal" class="detail-modal"><div class="detail-box"><button class="close-detail" id="closeDetail">×</button><div id="detail"></div></div></div><script>
const slug=location.pathname.split('/').pop(),restaurant=document.querySelector('#restaurant'),description=document.querySelector('#description'),address=document.querySelector('#address'),logo=document.querySelector('#logo'),menu=document.querySelector('#menu'),nav=document.querySelector('#categoryNav'),search=document.querySelector('#search');let DATA=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(q=''){if(!DATA)return;const v=q.trim().toLowerCase();nav.innerHTML=DATA.categories.map((c,i)=>`<button class="${i===0?'active':''}" data-cat="${c.id}">${esc(c.name)}</button>`).join('');let count=0;menu.innerHTML=DATA.categories.map(c=>{const ps=c.products.filter(p=>!v||(p.name+' '+(p.description||'')+' '+(p.tags||'')).toLowerCase().includes(v));count+=ps.length;return `<section id="cat-${c.id}" class="menu-category-public"><h2>${esc(c.name)}</h2>${ps.length?ps.map(p=>`<article class="menu-item" data-product="${p.id}"><img ${p.image_url?`src="${esc(p.image_url)}"`:''} style="${p.image_url?'':'display:none'}" alt=""><div class="menu-item-main"><strong>${esc(p.name)}</strong><p class="muted" style="margin:5px 0 0;font-size:13px;line-height:1.5">${esc(p.description||'')}</p><div class="badges">${p.featured?'<span class="badge">⭐ Vedette</span>':''}${p.tags?`<span class="badge">${esc(p.tags)}</span>`:''}${p.allergens?`<span class="badge">Allergènes: ${esc(p.allergens)}</span>`:''}</div></div><div class="price">${Number(p.price).toFixed(2)} €</div></article>`).join(''):'<div class="empty">Aucun produit disponible.</div>'}</section>`}).join('');if(!count)menu.innerHTML='<div class="no-results">Aucun produit ne correspond à votre recherche.</div>';}
function openProduct(id){const p=DATA.categories.flatMap(c=>c.products).find(x=>x.id==id);if(!p)return;document.querySelector('#detail').innerHTML=`${p.image_url?`<img src="${esc(p.image_url)}" alt="">`:''}<h2>${esc(p.name)}</h2><p>${esc(p.description||'')}</p><div class="badges">${p.featured?'<span class="badge">⭐ Produit vedette</span>':''}${p.allergens?`<span class="badge">Allergènes: ${esc(p.allergens)}</span>`:''}</div><h3 style="margin-top:18px">${Number(p.price).toFixed(2)} €</h3>`;document.querySelector('#detailModal').classList.add('open');}
document.querySelector('#closeDetail').onclick=()=>document.querySelector('#detailModal').classList.remove('open');document.querySelector('#detailModal').onclick=e=>{if(e.target.id==='detailModal')e.currentTarget.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('#detailModal').classList.remove('open')});menu.addEventListener('click',e=>{const item=e.target.closest('[data-product]');if(item)openProduct(item.dataset.product)});nav.addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;document.querySelector('#cat-'+b.dataset.cat)?.scrollIntoView({behavior:'smooth',block:'start'});nav.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')});search.oninput=()=>render(search.value);
fetch('/api/public/menu/'+encodeURIComponent(slug)).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(d=>{DATA=d;document.title=d.restaurant.name+' — Menu';restaurant.textContent=d.restaurant.name;description.textContent=d.restaurant.description||'';address.textContent=d.restaurant.address||'';if(d.restaurant.logo_url){logo.src=d.restaurant.logo_url;logo.style.display='inline-block'}if(d.restaurant.order_url){const b=document.querySelector('#orderBtn');b.href=d.restaurant.order_url;b.style.display='inline-flex'}if(d.restaurant.instagram){const b=document.querySelector('#instagramBtn');b.href=d.restaurant.instagram;b.style.display='inline-flex'}if(d.restaurant.theme==='dark')document.body.classList.add('theme-dark');if(d.restaurant.accent_color)document.documentElement.style.setProperty('--primary',d.restaurant.accent_color);render()}).catch(()=>{restaurant.textContent='Menu indisponible';description.textContent='Ce restaurant n’est pas accessible pour le moment.'});
</script></body></html>
